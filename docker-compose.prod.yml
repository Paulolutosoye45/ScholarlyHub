services:
  myapp:
    ports:
      - "127.0.0.1:8081:80"   # only reachable via localhost — host proxy handles public traffic
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"